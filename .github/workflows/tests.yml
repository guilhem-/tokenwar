name: Tests

# Ce dépôt ne déploie plus rien. La mise en ligne est manuelle, depuis le poste
# de l'auteur, avec tools/deploy.sh — voir DEPLOIEMENT.md.
# Ce workflow ne fait donc que garder le filet de sécurité : il dit si un commit
# casse la partie, sans jamais toucher à ce qui est en ligne.

on:
  push:
    branches:
      - claude/token-production-game-ci5u4l
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe JS
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Test des traductions (couverture)
        run: node test-i18n.mjs

      - name: Test UI (jsdom)
        run: |
          npm install jsdom --no-save --no-audit --no-fund
          node test-ui.mjs

      - name: Test simulation (partie complète)
        timeout-minutes: 15
        # pas de pipe direct : il masquerait le code de sortie du simulateur
        run: |
          node test-sim.mjs > sim.log
          tail -8 sim.log
