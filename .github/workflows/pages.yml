name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/token-production-game-ci5u4l
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution de déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la syntaxe JS
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Test des traductions (couverture)
        run: node test-i18n.mjs

      - name: Test UI (jsdom)
        run: |
          npm install jsdom --no-save --no-audit --no-fund
          node test-ui.mjs

      - name: Test simulation (partie complète)
        timeout-minutes: 15
        # pas de pipe direct : il masquerait le code de sortie du simulateur
        run: |
          node test-sim.mjs > sim.log
          tail -8 sim.log

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Site statique à la racine du dépôt
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
